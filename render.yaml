services:
  # 1. FastAPI REST Service
  - type: web
    name: carepredict-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_fastapi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_INTERVAL
        value: "300"

  # 2. Streamlit Dashboard Service
  - type: web
    name: carepredict-dashboard
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app_streamlit.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_INTERVAL
        value: "300"
